<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Anggota Baru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md space-y-6">
    <div class="text-center">
      <h2 class="text-2xl font-bold text-slate-800">Daftar Anggota Baru</h2>
      <p class="text-sm text-slate-500 mt-1">Lengkapi data di bawah ini untuk mendaftar</p>
    </div>

    <form id="formRegister" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
        <input type="text" id="regNama" required placeholder="Masukkan nama lengkap" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-600">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Nomor Telepon / WhatsApp</label>
        <input type="tel" id="regHp" required placeholder="Contoh: 081234567890" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-600">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email <span class="text-slate-400 font-normal">(Opsional)</span></label>
        <input type="email" id="regEmail" placeholder="contoh@email.com" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-600">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" id="regPassword" minlength="6" required placeholder="Minimal 6 karakter" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-600">
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm py-2.5 rounded-lg transition duration-200">
        Daftar Sekarang
      </button>
    </form>

    <div class="text-center text-xs text-slate-500">
      Sudah punya akun? <a href="login.html" class="text-blue-600 hover:underline font-semibold">Masuk di sini</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://btkmwasloxwrwmffthsu.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_XgB1KWcve2v-30R7PbbPew_oRaxz4WG";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('formRegister').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nama = document.getElementById('regNama').value.trim();
      const hp = document.getElementById('regHp').value.trim();
      const inputEmail = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.innerText = "Mendaftarkan...";

      // Jika Email kosong, buat format internal dari No HP
      const authEmail = inputEmail !== "" ? inputEmail : `${hp}@phone.tchi.internal`;

      // 1. Register Auth di Supabase
      const { data, error } = await _supabase.auth.signUp({ 
        email: authEmail, 
        password: password 
      });

      if (error) {
        alert("Gagal Pendaftaran: " + error.message);
        btn.disabled = false;
        btn.innerText = "Daftar Sekarang";
      } else if (data.user) {
        // 2. Simpan Data Profil ke Tabel 'profiles'
        const { error: profileError } = await _supabase.from('profiles').upsert({
          id: data.user.id,
          nama_lengkap: nama,
          no_hp: hp,
          role: 'anggota',
          poin: 100
        });

        if (profileError) {
          console.error("Gagal simpan profil:", profileError);
        }

        alert("Pendaftaran Berhasil!");
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
