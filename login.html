<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Anggota</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Masuk ke Akun</h2>

    <div id="message" class="hidden mb-4 p-3 rounded text-sm text-center"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="contoh@email.com">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan password">
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-semibold transition duration-200">
        Masuk
      </button>
    </form>

    <p class="text-xs text-gray-500 mt-4 text-center">
      Belum punya akun? <a href="index.html" class="text-blue-600 hover:underline">Daftar di sini</a>
    </p>
  </div>

  <script>
    const SUPABASE_URL = "https://btkmwasloxwrwmffthsu.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_XgB1KWcve2v-30R7PbbPew_oRaxz4WG";

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('loginForm');
    const messageBox = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      messageBox.className = "mb-4 p-3 rounded text-sm text-center bg-blue-100 text-blue-700 block";
      messageBox.innerText = "Memeriksa data masuk...";

      const { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        messageBox.className = "mb-4 p-3 rounded text-sm text-center bg-red-100 text-red-700 block";
        messageBox.innerText = "Gagal masuk: " + error.message;
      } else {
        messageBox.className = "mb-4 p-3 rounded text-sm text-center bg-green-100 text-green-700 block";
        messageBox.innerText = "Login berhasil! Memindahkan ke dashboard...";
        
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
