<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - The Circle Hub Indonesia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 font-sans antialiased text-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl space-y-6">
    
    <!-- LOGO & HEADING -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center font-black text-2xl mx-auto shadow-lg text-white">
        C
      </div>
      <h2 class="text-2xl font-black tracking-tight text-white">The Circle Hub</h2>
      <p class="text-xs text-slate-400">Masuk ke Ekosistem Digital Komunitas Indonesia</p>
    </div>

    <!-- TAB PILIHAN LOGIN / DAFTAR -->
    <div class="bg-slate-900 p-1 rounded-2xl flex text-xs font-bold border border-slate-700">
      <button id="tabBtnLogin" onclick="switchAuthTab('login')" class="w-1/2 py-2.5 rounded-xl bg-blue-600 text-white transition">
        <i class="fa-solid fa-right-to-bracket mr-1.5"></i>Masuk
      </button>
      <button id="tabBtnRegister" onclick="switchAuthTab('register')" class="w-1/2 py-2.5 rounded-xl text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-user-plus mr-1.5"></i>Daftar Baru
      </button>
    </div>

    <!-- FORM LOGIN (EMAIL / NO HP) -->
    <form id="formLogin" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Email atau No. Telepon / WA</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
          <input type="text" id="loginIdentifier" required placeholder="Email atau 081234567890" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Kata Sandi</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <button type="submit" id="btnLoginSubmit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm py-3 rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
        <span>Masuk ke Akun</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <!-- FORM REGISTRASI ANGGOTA BARU (DENGAN NO TELP/WA) -->
    <form id="formRegister" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Nama Lengkap</label>
        <input type="text" id="regNama" required placeholder="Nama Sesuai KTP" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Nomor Telepon / WhatsApp</label>
        <input type="tel" id="regHp" required placeholder="Contoh: 081234567890" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Email <span class="text-slate-500 font-normal">(Opsional)</span></label>
        <input type="email" id="regEmail" placeholder="email@domain.com (Opsional)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Kata Sandi</label>
        <input type="password" id="regPassword" minlength="6" required placeholder="Minimal 6 Karakter" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <button type="submit" id="btnRegSubmit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm py-3 rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
        <span>Daftar Sekarang</span>
        <i class="fa-solid fa-user-check text-xs"></i>
      </button>
    </form>

    <!-- FOOTER NAVIGASI -->
    <div class="border-t border-slate-700/60 pt-4 text-center">
      <p class="text-[11px] text-slate-400">
        Mengalami kendala? <a href="https://wa.me/" target="_blank" class="text-blue-400 hover:underline font-semibold">Hubungi Bantuan Admin</a>
      </p>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://btkmwasloxwrwmffthsu.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_XgB1KWcve2v-30R7PbbPew_oRaxz4WG";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Auto Check Session
    async function checkSession() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        redirectUser(session.user.id);
      }
    }
    checkSession();

    // Tab Switcher
    function switchAuthTab(type) {
      if (type === 'login') {
        document.getElementById('formLogin').classList.remove('hidden');
        document.getElementById('formRegister').classList.add('hidden');
        document.getElementById('tabBtnLogin').className = "w-1/2 py-2.5 rounded-xl bg-blue-600 text-white transition";
        document.getElementById('tabBtnRegister').className = "w-1/2 py-2.5 rounded-xl text-slate-400 hover:text-white transition";
      } else {
        document.getElementById('formLogin').classList.add('hidden');
        document.getElementById('formRegister').classList.remove('hidden');
        document.getElementById('tabBtnRegister').className = "w-1/2 py-2.5 rounded-xl bg-blue-600 text-white transition";
        document.getElementById('tabBtnLogin').className = "w-1/2 py-2.5 rounded-xl text-slate-400 hover:text-white transition";
      }
    }

    // PROSES LOGIN (SUPPORT EMAIL ATAU NO HP)
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLoginSubmit');

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i>Memeriksa...`;

      // Cek apakah input berupa Email atau No HP
      let authEmail = identifier;
      const isNumber = /^[0-9]+$/.test(identifier);

      if (isNumber) {
        // Jika No HP, ubah format ke email internal
        authEmail = `${identifier}@phone.tchi.internal`;
      }

      const { data, error } = await _supabase.auth.signInWithPassword({ email: authEmail, password });

      if (error) {
        alert("Gagal Login: Email/No. HP atau Kata Sandi salah.");
        btn.disabled = false;
        btn.innerHTML = `<span>Masuk ke Akun</span><i class="fa-solid fa-arrow-right text-xs"></i>`;
      } else {
        redirectUser(data.user.id);
      }
    });

    // PROSES REGISTRASI ANGGOTA (NO TELP WA + EMAIL)
    document.getElementById('formRegister').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama = document.getElementById('regNama').value.trim();
      const hp = document.getElementById('regHp').value.trim();
      const inputEmail = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('btnRegSubmit');

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i>Mendaftarkan...`;

      // Jika Email kosong, gunakan No HP sebagai Email login
      const authEmail = inputEmail !== "" ? inputEmail : `${hp}@phone.tchi.internal`;

      const { data, error } = await _supabase.auth.signUp({ email: authEmail, password });

      if (error) {
        alert("Gagal Pendaftaran: " + error.message);
        btn.disabled = false;
        btn.innerHTML = `<span>Daftar Sekarang</span><i class="fa-solid fa-user-check text-xs"></i>`;
      } else if (data.user) {
        // Simpan Profil Anggota ke Database Supabase
        await _supabase.from('profiles').upsert({
          id: data.user.id,
          nama_lengkap: nama,
          no_hp: hp,
          role: 'anggota',
          poin: 100,
          created_at: new Date()
        });

        alert("Pendaftaran Berhasil! Anda sekarang bisa login menggunakan Email atau No. Telepon Anda.");
        switchAuthTab('login');
      }
    });

    // ROUTING BERDASARKAN ROLE
    async function redirectUser(userId) {
      const { data: profile } = await _supabase.from('profiles').select('role').eq('id', userId).single();
      
      if (profile && profile.role === 'admin') {
        window.location.href = "admin.html";
      } else {
        window.location.href = "dashboard.html";
      }
    }
  </script>
</body>
</html>
