<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - The Circle Hub Indonesia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 font-sans text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700/60 rounded-3xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center font-black text-2xl text-white shadow-lg shadow-blue-600/30">
        C
      </div>
      <h1 class="text-2xl font-bold tracking-tight">The Circle Hub</h1>
      <p class="text-xs text-slate-400">Superapp Komunitas Indonesia</p>
    </div>

    <div id="errorAlert" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3 rounded-xl text-xs font-medium"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Email</label>
        <input type="email" id="email" required placeholder="nama@email.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Kata Sandi</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition">
      </div>
      <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-600/30 transition text-sm">
        Masuk ke Sistem
      </button>
    </form>

    <p class="text-center text-xs text-slate-400">
      Belum punya akun? <a href="index.html" class="text-blue-400 font-bold hover:underline">Daftar anggota</a>
    </p>
  </div>

  <script>
    const SUPABASE_URL = "https://btkmwasloxwrwmffthsu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_XgB1KWcve2v-30R7PbbPew_oRaxz4WG";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnSubmit');
      const alertBox = document.getElementById('errorAlert');

      btn.innerText = "Memproses...";
      btn.disabled = true;
      alertBox.classList.add('hidden');

      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

      if (error) {
        alertBox.innerText = error.message;
        alertBox.classList.remove('hidden');
        btn.innerText = "Masuk ke Sistem";
        btn.disabled = false;
      } else {
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
