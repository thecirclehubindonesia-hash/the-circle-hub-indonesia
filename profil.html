<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Anggota - The Circle Hub Indonesia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen flex flex-col md:flex-row">

  <!-- Sidebar Navigasi -->
  <aside class="w-full md:w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col justify-between">
    <div>
      <div class="p-6 flex items-center gap-3 border-b border-slate-800">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-blue-500/30">C</div>
        <div>
          <h1 class="font-bold text-lg tracking-wide">The Circle Hub</h1>
          <p class="text-[10px] text-slate-400">Komunitas Indonesia</p>
        </div>
      </div>

      <nav class="p-4 space-y-1.5 text-sm font-medium">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition"><span>🏠</span> Beranda Utama</a>
        <a href="kas.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition"><span>💼</span> Kas & Transaksi</a>
        <a href="laporan.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition"><span>📊</span> Laporan Keuangan</a>
        <a href="umkm.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition"><span>🏪</span> Grup UMKM</a>
        <a href="event.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition"><span>📅</span> Event & Agenda</a>
        <a href="profil.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600 text-white shadow-md shadow-blue-600/20"><span>👤</span> Profil Anggota</a>
      </nav>
    </div>

    <div class="p-4 border-t border-slate-800">
      <button id="btnLogout" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-rose-400 hover:bg-rose-500/10 transition font-medium text-sm"><span>🚪</span> Keluar Sesi</button>
    </div>
  </aside>

  <!-- Konten Utama Halaman -->
  <main class="flex-1 p-4 md:p-8 overflow-y-auto space-y-6">
    <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <h2 class="text-xl font-bold text-slate-800">👤 Profil Anggota</h2>
      <p class="text-xs text-slate-500 mt-0.5">Pengaturan informasi pribadi dan kredensial akun anggota komunitas.</p>
    </header>

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-xl space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Nama Lengkap</label>
        <p id="profileName" class="text-sm font-bold text-slate-800 bg-slate-50 p-3 rounded-xl border border-slate-100">Memuat...</p>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Nomor WhatsApp / HP</label>
        <p id="profilePhone" class="text-sm font-bold text-slate-800 bg-slate-50 p-3 rounded-xl border border-slate-100">Memuat...</p>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Peran Akses (Role)</label>
        <p id="profileRole" class="text-sm font-bold text-blue-600 bg-blue-50 p-3 rounded-xl border border-blue-100 inline-block">Anggota Aktif</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://btkmwasloxwrwmffthsu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_XgB1KWcve2v-30R7PbbPew_oRaxz4WG";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadProfileData() {
      const { data: { user } } = await _supabase.auth.getUser();
      if (!user) { window.location.href = "login.html"; return; }

      const { data: profile } = await _supabase.from('profiles').select('*').eq('id', user.id).single();
      if (profile) {
        document.getElementById('profileName').innerText = profile.nama_lengkap || '-';
        document.getElementById('profilePhone').innerText = profile.no_hp || '-';
        if (profile.role) document.getElementById('profileRole').innerText = profile.role.toUpperCase();
      }
    }

    loadProfileData();

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await _supabase.auth.signOut();
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
